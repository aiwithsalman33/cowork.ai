name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cowork
          POSTGRES_PASSWORD: cowork
          POSTGRES_DB: cowork_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U cowork" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: cd apps/api && npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
