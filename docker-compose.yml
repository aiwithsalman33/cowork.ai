# CoworkAI — LOCAL development stack with hot reload.
#
#   docker compose up --build        → web http://localhost:3000 · api http://localhost:4000
#
# Source is bind-mounted; node_modules live in a named volume inside the containers.
# For production use docker-compose.prod.yml (Caddy on :8080).
name: coworkai-dev

x-dev: &dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: coworkai-dev:latest
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - wa_sessions:/data/wa-sessions
  env_file:
    - path: .env
      required: false
  environment:
    NODE_ENV: development
    DATABASE_URL: postgresql://partner:partner@db:5432/partner?schema=public
    WEB_ORIGIN: http://localhost:3000
    PUBLIC_API_URL: http://localhost:4000
    WA_SESSIONS_DIR: /data/wa-sessions
    API_INTERNAL_URL: http://api:4000
    # file watching over Windows/macOS bind mounts
    WATCHPACK_POLLING: 'true'
    CHOKIDAR_USEPOLLING: 'true'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: partner
      POSTGRES_PASSWORD: partner
      POSTGRES_DB: partner
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U partner -d partner']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *dev
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npm run build -w @partner/shared &&
             cd apps/api && npx prisma generate && npx prisma migrate deploy &&
             npx tsx watch src/index.ts"
    ports:
      - '4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10

  web:
    <<: *dev
    depends_on:
      api:
        condition: service_healthy
    command: sh -c "npm run build -w @partner/shared && npm run dev -w @partner/web"
    ports:
      - '3000:3000'

volumes:
  pgdata:
  node_modules:
  wa_sessions:
